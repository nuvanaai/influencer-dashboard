<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3600">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <meta name="theme-color" content="#0b1220">
  <title>Portfolio Daily Brief</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: #0b1220;
      color: #e5e7eb;
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
    }
    .pill {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    }
    .pill-long { background: rgba(16,185,129,0.12); color: #34d399; }
    .pill-short { background: rgba(244,63,94,0.12); color: #fb7185; }
    .pill-puts { background: rgba(168,85,247,0.14); color: #c4b5fd; }
    .pill-cash { background: rgba(148,163,184,0.14); color: #cbd5e1; }
    .row-hover:hover { background: rgba(255,255,255,0.02); }
    .bar {
      height: 6px; border-radius: 3px;
      background: linear-gradient(90deg, #6366f1, #22d3ee);
    }
    .bar-short { background: linear-gradient(90deg, #ef4444, #f97316); }
    .bar-puts { background: linear-gradient(90deg, #a855f7, #ec4899); }
    .bar-cash { background: linear-gradient(90deg, #94a3b8, #64748b); }
    .impact-positive { color: #34d399; }
    .impact-negative { color: #fb7185; }
    .impact-mixed { color: #fbbf24; }
    .impact-negative_for_short { color: #fb7185; }
    .impact-negative_for_puts { color: #fb7185; }
    .news-card a { color: #93c5fd; }
    .news-card a:hover { text-decoration: underline; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b1220; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #374151; }
    .divider { border-top: 1px solid #1f2937; }
    .chip {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 600;
      background: #1f2937; color: #9ca3af;
      margin-right: 4px; margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="max-w-[1200px] mx-auto px-4 sm:px-6 py-6">
    <!-- Header -->
    <header class="flex items-start justify-between mb-6 flex-wrap gap-3">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Portfolio Daily Brief</h1>
        <p class="text-sm text-slate-400 mt-1" id="as-of">Loading…</p>
      </div>
      <button onclick="location.reload()" class="text-xs font-medium text-sky-400 hover:text-sky-300 flex items-center gap-1 bg-slate-800/60 px-3 py-2 rounded-lg border border-slate-700">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Refresh
      </button>
    </header>

    <!-- Summary Stats -->
    <div id="summary-stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6"></div>

    <!-- Daily Review -->
    <section class="card p-5 mb-6">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-xs font-semibold text-sky-400 uppercase tracking-widest">Daily Review</span>
        <span id="review-date" class="text-xs text-slate-500 mono"></span>
      </div>
      <h2 id="review-headline" class="text-lg sm:text-xl font-semibold text-white leading-snug mb-3"></h2>
      <p id="review-summary" class="text-sm text-slate-300 leading-relaxed mb-5"></p>

      <div class="grid md:grid-cols-3 gap-4">
        <div>
          <h3 class="text-xs font-semibold text-rose-400 uppercase tracking-wide mb-2">Risks</h3>
          <ul id="review-risks" class="space-y-2 text-sm text-slate-300"></ul>
        </div>
        <div>
          <h3 class="text-xs font-semibold text-emerald-400 uppercase tracking-wide mb-2">Bright spots</h3>
          <ul id="review-bright" class="space-y-2 text-sm text-slate-300"></ul>
        </div>
        <div>
          <h3 class="text-xs font-semibold text-amber-400 uppercase tracking-wide mb-2">Actions to consider</h3>
          <ul id="review-actions" class="space-y-2 text-sm text-slate-300"></ul>
        </div>
      </div>
    </section>

    <div class="grid lg:grid-cols-5 gap-4 mb-6">
      <!-- Holdings -->
      <section class="card p-5 lg:col-span-3">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-semibold text-white">Current Portfolio</h2>
          <span id="holding-count" class="text-xs text-slate-500"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-xs text-slate-500 uppercase tracking-wider border-b border-slate-800">
                <th class="py-2 pr-2">Asset</th>
                <th class="py-2 px-2">Type</th>
                <th class="py-2 px-2 text-right">Weight</th>
                <th class="py-2 pl-2 w-[30%]"></th>
              </tr>
            </thead>
            <tbody id="holdings-body"></tbody>
          </table>
        </div>
      </section>

      <!-- News -->
      <section class="card p-5 lg:col-span-2">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-semibold text-white">News related to holdings</h2>
          <span id="news-count" class="text-xs text-slate-500"></span>
        </div>
        <div id="news-list" class="space-y-3"></div>
      </section>
    </div>

    <footer class="text-center text-xs text-slate-600 py-6">
      Update <code class="mono text-slate-500">portfolio/data/portfolio.json</code> to refresh the brief.
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
